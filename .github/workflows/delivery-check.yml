name: Delivery validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore StoreDiscovery.sln
      - name: Build
        run: >
          dotnet build StoreDiscovery.sln --configuration Release --no-restore
      - name: Test
        run: >
          dotnet test StoreDiscovery.sln --configuration Release --no-build
          --verbosity normal

  mobile:
    name: Mobile analyze, test, and debug APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Generate Android runner
        run: |
          flutter create \
            --platforms=android \
            --project-name=store_discovery \
            --org=tw.konoha \
            --no-pub .
      - name: Get dependencies
        run: flutter pub get
      - name: Normalize formatting
        run: dart format .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
